[workspace]
resolver = "2"
# Every `*-extension` directory is a member, so adding an extension needs no
# edit here and a directory that is not checked out cannot break the workspace.
members = ["*-extension"]

[workspace.dependencies]
sidex-extension-sdk = { path = "../crates/extension-sdk" }
wit-bindgen = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
