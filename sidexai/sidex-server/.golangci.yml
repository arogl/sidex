version: "2"

# golangci-lint's default linters (errcheck, govet, ineffassign, staticcheck, unused) plus the
# formatter check. No findings are excluded.
formatters:
  enable:
    - gofmt

# Report every finding instead of the default cap of 50 per linter and 3 identical ones.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
