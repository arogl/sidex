name: Unused Dependencies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udeps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/Cargo.toml"
      - "crates/**/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/udeps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/Cargo.toml"
      - "crates/**/Cargo.toml"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTUP_TOOLCHAIN: nightly

concurrency:
  group: udeps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-udeps:
    name: cargo-udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./apps/desktop -> target"

      - name: Install cargo-udeps
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-udeps

      - name: Check for unused dependencies
        run: cargo udeps --manifest-path apps/desktop/Cargo.toml --all-targets --all-features
