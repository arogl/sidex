name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "package.json"
      - "bun.lock"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Audit the workspace-root Cargo.lock — the lockfile cargo actually
        # resolves and builds from. apps/desktop is a workspace *member*, so its
        # per-crate Cargo.lock was an unmaintained orphan (cargo ignored it) and
        # has been removed; auditing it silently drifted from the real deps.
        #
        # Ignored advisories are accepted, tracked tech-debt:
        #   RUSTSEC-2023-0071      rsa Marvin attack — no fixed upstream release
        #                          (reached through russh and ssh-key)
        run: >
          cargo audit --file Cargo.lock
          --ignore RUSTSEC-2023-0071

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit --audit-level=high
