name: Lint Rust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lint-rust.yml"
      - "crates/**"
      - "apps/desktop/**"
      - "extensions-wasm/**"
      - "crates/extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-rust.yml"
      - "crates/**"
      - "apps/desktop/**"
      - "extensions-wasm/**"
      - "crates/extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: lint-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./apps/desktop -> target"

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --all-features -- -D warnings
