# Keeps the commit-SHA pins in .github/workflows fresh. Dependabot opens a PR
# that bumps the SHA and the "# vX.Y.Z" comment next to it. Review the release
# notes in each PR before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
