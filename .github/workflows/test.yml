name: Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "crates/**"
      - "apps/desktop/**"
      - "crates/extension-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "wasm/**"
      - "packages/build/**"
      - "examples/**"
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  rust-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: test-${{ matrix.os }}

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  wasm-tfidf:
    name: wasm tfidf (build + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust unit tests
        run: cargo test --manifest-path wasm/tfidf/Cargo.toml

      - name: Build the test fixture and run parity
        run: |
          bun run build:wasm:test
          bun test packages/build/test/tfidf-parity.test.ts

      - name: Build the production artifact and assert it exists
        run: |
          bun run build:wasm
          test -f apps/workbench/public/wasm/tfidf/sidex_tfidf_wasm.js
          test -f apps/workbench/public/wasm/tfidf/sidex_tfidf_wasm_bg.wasm

  examples:
    name: build examples (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Run from the repo root so the target is added to the toolchain that
      # rust-toolchain.toml selects, which is the one cargo uses below.
      - name: Add the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "examples/hello-extension -> target"
          key: examples

      # examples/ is outside every Cargo workspace, so nothing else builds it
      # and it can go stale when the extension SDK changes.
      - name: Build hello-extension
        run: cargo build --manifest-path examples/hello-extension/Cargo.toml --target wasm32-wasip2 --release

      - name: Assert the component was produced
        run: test -f examples/hello-extension/target/wasm32-wasip2/release/hello_extension.wasm
