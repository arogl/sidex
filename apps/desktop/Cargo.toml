[package]
name = "sidex"
version = "0.1.3"
description = "A fast, open-source code editor"
keywords = ["editor", "ide", "tauri", "vscode", "webview"]
authors = ["Siden Technologies Inc"]
license = "MIT"
repository = "https://github.com/sidenai/sidex"
edition = "2021"
rust-version = "1.91.0"

[[bin]]
name = "SideX"
path = "src/main.rs"

[lib]
name = "sidex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [
  "protocol-asset",
  "tray-icon",
  "devtools",
] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
notify = { version = "8", features = ["macos_fsevent"] }
portable-pty = "0.9"
walkdir = "2"
ignore = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
hostname = "0.4"
dirs = "7"
reqwest = { version = "0.13", features = [
  "rustls",
  "blocking",
  "gzip",
  "deflate",
  "brotli",
] }

# Compression & encoding
flate2 = "1"
zip = "9"
base64 = "0.23"

# Crypto
sha2 = "0.11"
hex = "0.4"
dotenvy = "0.15"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
chrono = "0.4"

# Path utilities
pathdiff = "0.2"
dunce = "1"
glob = "0.3"
globset = "0.4"

# Search indexing
dashmap = "6"
rayon = "1.10"
regex = "1"
memchr = "2"

# Process & terminal management
which = "8"
crossbeam = "0.8"

# WebSocket for orchestration
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"

# Extension API helpers
arboard = "3"
open = "5"
url = "2"

# WASM extension runtime
wasmtime = { version = "50", default-features = false, features = [
  "runtime",
  "component-model",
  "cranelift",
  "async",
] }
wasmtime-wasi = "50"
toml = "0.8"
anyhow = "1"
sidex-db = { path = "../../crates/db" }
sidex-dap = { path = "../../crates/dap" }
sidex-remote = { path = "../../crates/remote" }
sidex-settings = { path = "../../crates/settings" }
sidex-theme = { path = "../../crates/theme" }

# SideX crates
sidex-git = { path = "../../crates/git" }
sidex-workspace = { path = "../../crates/workspace" }

# Internal crates
sidex-text = { path = "../../crates/text" }
sidex-syntax = { path = "../../crates/syntax" }
sidex-tasks = { path = "../../crates/tasks" }
sidex-extensions = { path = "../../crates/extensions" }
sidex-terminal = { path = "../../crates/terminal" }
sidex-lsp = { path = "../../crates/lsp" }
sidex-keymap = { path = "../../crates/keymap" }
sidex-extension-api = { path = "../../crates/extension-api" }
sidex-update = { path = "../../crates/update" }
sidex-profiles = { path = "../../crates/profiles" }
sidex-auth = { path = "../../crates/auth" }
sidex-textmate = { path = "../../crates/textmate" }
sidex-context = { path = "../../crates/context" }
sidex-agent = { path = "../../crates/agent" }

tree-sitter = "0.27"
tree-sitter-rust = "0.24"
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Used by the WASM runtime tests to build extension components from the WIT world.
wasm-encoder = "0.262"
wasmparser = "0.262"
wit-component = { version = "0.262", features = ["dummy-module"] }
wit-parser = "0.262"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
